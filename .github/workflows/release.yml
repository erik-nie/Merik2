name: Release

# Bouwt een DMG voor Apple silicon, een DMG voor Intel-Macs en een installatieprogramma (Windows) en zet ze als
# concept-release op GitHub. Starten door een tag te pushen:
#
#   git tag -a v0.2.0-alpha.2 -m "Alpha 2" && git push origin v0.2.0-alpha.2
#
# Handmatig starten (Actions > Release > Run workflow) bouwt alleen de
# bestanden, zonder release te maken.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install fluid-synth pkg-config dylibbundler

      - name: Import the signing certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$MACOS_CERT_P12_BASE64" ]]; then
            echo "No signing secrets: the build is signed ad hoc."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Spaties en regeleinden uit het geplakte secret halen; de lengte (niet de inhoud) tonen als controle.
          CLEAN="$(printf '%s' "$MACOS_CERT_P12_BASE64" | tr -d '[:space:]')"
          echo "Certificate secret length: ${#CLEAN} characters"
          printf '%s' "$CLEAN" | base64 --decode > "$RUNNER_TEMP/certificate.p12" || { echo "The certificate secret is not valid base64: recreate it with: base64 -i certificaat.p12 | pbcopy"; exit 1; }
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)".*/\1/')"
          [[ -n "$IDENTITY" ]] || { echo "No Developer ID Application identity found"; security find-identity -v "$KEYCHAIN"; exit 1; }
          echo "Signing as: $IDENTITY"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          xcrun notarytool store-credentials merik-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$KEYCHAIN"
          echo "NOTARY_PROFILE=merik-notary" >> "$GITHUB_ENV"

      - name: Build the DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then VERSION="dev"; fi
          scripts/make-release.sh "$VERSION"

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg

  macos-intel:
    name: macOS DMG (Intel)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install fluid-synth pkg-config dylibbundler

      - name: Import the signing certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$MACOS_CERT_P12_BASE64" ]]; then
            echo "No signing secrets: the build is signed ad hoc."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Spaties en regeleinden uit het geplakte secret halen; de lengte (niet de inhoud) tonen als controle.
          CLEAN="$(printf '%s' "$MACOS_CERT_P12_BASE64" | tr -d '[:space:]')"
          echo "Certificate secret length: ${#CLEAN} characters"
          printf '%s' "$CLEAN" | base64 --decode > "$RUNNER_TEMP/certificate.p12" || { echo "The certificate secret is not valid base64: recreate it with: base64 -i certificaat.p12 | pbcopy"; exit 1; }
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)".*/\1/')"
          [[ -n "$IDENTITY" ]] || { echo "No Developer ID Application identity found"; security find-identity -v "$KEYCHAIN"; exit 1; }
          echo "Signing as: $IDENTITY"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          xcrun notarytool store-credentials merik-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$KEYCHAIN"
          echo "NOTARY_PROFILE=merik-notary" >> "$GITHUB_ENV"

      - name: Build the DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then VERSION="dev"; fi
          scripts/make-release.sh "$VERSION"

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-intel
          path: dist/*.dmg

  windows:
    name: Windows installer
    runs-on: windows-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Get vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure
        shell: pwsh
        run: cmake --preset windows

      - name: Build
        shell: pwsh
        run: cmake --build --preset windows-release --parallel

      - name: Package the installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { 'dev' }
          $name = "Merik-$version-windows-x64"
          $stage = Join-Path $PWD "dist\$name"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          $built = Get-ChildItem -Path build-windows -Recurse -Filter Merik.exe | Select-Object -First 1
          Copy-Item "$($built.DirectoryName)\*" $stage -Recurse -Force

          # Visual C++-runtime meeleveren, zodat er niets geïnstalleerd hoeft te worden.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC" -Directory |
                 Where-Object { $_.Name -match '^\d' } |
                 Sort-Object Name -Descending |
                 ForEach-Object { Get-ChildItem "$($_.FullName)\x64" -Directory -ErrorAction SilentlyContinue | Where-Object Name -like 'Microsoft.VC*.CRT' } |
                 Select-Object -First 1
          if ($crt) { Copy-Item "$($crt.FullName)\*.dll" $stage -Force } else { Write-Warning "VC runtime not found" }

          Copy-Item LICENSE "$stage\LICENSE.txt"
          Copy-Item THIRD-PARTY-LICENSES.md $stage

          # Het installatieprogramma (Inno Setup) maken uit de map met Merik.exe.
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$version" "/DSourceDir=$stage" "/DOutputDir=$PWD\dist" installer\merik.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

          # De map zelf hoort niet in de release.
          Remove-Item $stage -Recurse -Force
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe

  release:
    name: Create the draft release
    needs: [macos, macos-intel, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="docs/release-notes/$VERSION.md"
          [[ -f "$NOTES" ]] || { echo "Missing $NOTES"; exit 1; }

          FLAGS=""
          if [[ "$VERSION" == *-* ]]; then FLAGS="--prerelease"; fi

          (cd artifacts && shasum -a 256 *) > checksums.txt
          cat checksums.txt

          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "Merik $VERSION" --draft $FLAGS \
            --notes-file "$NOTES"
